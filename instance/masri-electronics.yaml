static_pages:
  - slug: "about"
    title: "من نحن"
    lead: "متجر المصري للأدوات الكهربائية — معلومات هذه النسخة للمراجعة فقط."
    content: "نعرض أجهزة وأدوات كهربائية للاستخدام المنزلي. تفاصيل التوفر والخدمة تُؤكَّد مع فريق المتجر قبل إتمام الطلب."
  - slug: "privacy-policy"
    title: "سياسة الخصوصية"
    lead: "نص تجريبي للمراجعة؛ يحتاج اعتماد المالك قبل الإطلاق."
    content: "نستخدم بيانات التواصل والعنوان والطلب لمعالجة الطلب والتواصل بشأنه. قد تُشارك تفاصيل التوصيل اللازمة مع مزود التوصيل عند الحاجة. للاستفسار عن بياناتك أو طلب تصحيحها، تواصل عبر قنوات المتجر المعلنة."
  - slug: "return-policy"
    title: "سياسة الاستبدال والاسترجاع"
    lead: "نص تجريبي للمراجعة؛ يحتاج اعتماد المالك قبل الإطلاق."
    content: "إذا واجهت مشكلة في المنتج أو رغبت في استبداله أو إرجاعه، تواصل مع المتجر مع رقم الطلب وتفاصيل الحالة. تُراجع الأهلية وحالة المنتج وفق السياسة المعتمدة عند الإطلاق وحقوق المستهلك المعمول بها. لا يحدد هذا النص التجريبي مدة أو شرطاً نهائياً."
  - slug: "terms"
    title: "الشروط والأحكام"
    lead: "نص تجريبي للمراجعة؛ يحتاج اعتماد المالك قبل الإطلاق."
    content: "تظهر الأسعار ورسوم التوصيل المتاحة عند إتمام الطلب. يخضع تأكيد الطلب والتوفر لمراجعة المتجر. تُحدَّد تفاصيل الضمان حسب المنتج والعلامة التجارية حيث ينطبق ذلك، وتُوضَّح عند التأكيد. يتوقف توفر التركيب على نوع المنتج والمنطقة، ويُؤكَّد قبل ترتيب الخدمة."
  - slug: "shipping-policy"
    title: "سياسة التوصيل"
    lead: "نص تجريبي للمراجعة؛ يحتاج اعتماد المالك قبل الإطلاق."
    content: |-
      تختلف رسوم التوصيل حسب المنطقة المتاحة، وتظهر الرسوم المحسوبة في صفحة إتمام الطلب. لا يُعد وقت الوصول مضموناً حتى يؤكده فريق المتجر.

      يمكن اختيار الاستلام من المتجر في النسخة التجريبية؛ انتظر تأكيد جاهزية الطلب قبل الحضور.
  - slug: "contact"
    title: "تواصل معنا"
    lead: "للاستفسار عن المنتجات أو الطلبات، استخدم قنوات التواصل المعروضة في هذه الصفحة. بيانات الخدمة وساعات العمل هنا للمراجعة فقط."
    content: "يمكن طلب معلومات عن التوصيل أو الاستلام أو الضمان أو التركيب قبل تأكيد الطلب."

